server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path that isn't a real static file serves index.html
    # so client-side routing (if added later) doesn't 404 on refresh.
    # /api/* never reaches this container - Caddy routes it to the backend
    # directly (see ../Caddyfile).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
